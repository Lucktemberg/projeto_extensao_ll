<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Estoque</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navigation :: appHeader}"></div>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Itens em estoque</h2>
            <p class="descricao">Acompanhe, cadastre e ajuste os itens disponíveis para doação.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Novo Item</button>
    </div>

    <div class="barra-lista">
        <input type="search" placeholder="Buscar item..."
               oninput="filtrarEstoques(this)"
               aria-label="Buscar itens de estoque">
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Novo Item de Estoque</h3>

        <input type="hidden" id="id">

        <div class="form-grid">
            <div>
                <label>Descrição</label>
                <input type="text" id="descricao" placeholder="Descrição do item">
            </div>

            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidade" placeholder="Quantidade" min="0">
            </div>

            <div class="campo-completo">
                <label>Categoria</label>
                <select id="categoria">
                    <option value="">Selecione</option>
                    <option value="ALIMENTOS">Alimentos</option>
                    <option value="VESTUARIO">Vestuário</option>
                </select>
            </div>
        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <div id="listaEstoques"></div>

</main>

<script>
    function novoCadastro() {
        limparFormulario();
        document.getElementById("tituloFormulario").innerText = "Novo Item de Estoque";
        mostrarFormulario();
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("descricao").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("categoria").value = "";
    }

    function rotuloCategoria(categoria) {
        const chave = String(categoria ?? "").trim().toUpperCase();
        if (chave === "ALIMENTOS") {
            return "Alimentos";
        }
        if (chave === "VESTUARIO") {
            return "Vestuário";
        }
        return chave ? chave.charAt(0) + chave.slice(1).toLowerCase() : "Outros";
    }

    function chaveCategoria(categoria) {
        const chave = String(categoria ?? "").trim().toUpperCase();
        return chave || "OUTROS";
    }

    function linhaEstoque(estoque) {
        const quantidade = estoque.quantidade ?? 0;
        const classe = quantidade <= 0 ? "linha-zerada" : "";
        const selo = quantidade <= 0
            ? '<span class="selo-zerado">Zerado</span>'
            : quantidade <= 3
                ? '<span class="selo-baixo">Baixo</span>'
                : "";

        return `
            <tr class="${classe}">
                <td>${estoque.id}</td>
                <td>${textoSeguro(estoque.descricao)}</td>
                <td>${quantidade} ${selo}</td>
                <td>
                    <button class="btn-tabela btn-azul" onclick="editar(${estoque.id})">Editar</button>
                    <button class="btn-tabela btn-vermelho" onclick="excluir(${estoque.id})">Excluir</button>
                </td>
            </tr>
        `;
    }

    function carregarEstoques() {
        fetch("/estoques")
            .then(response => response.json())
            .then(estoques => {
                const lista = document.getElementById("listaEstoques");
                lista.innerHTML = "";

                if (estoques.length === 0) {
                    lista.innerHTML = `
                        <section class="card-tabela">
                            <table>
                                <tbody id="tabelaEstoques"></tbody>
                            </table>
                        </section>
                    `;
                    tabelaVazia(document.getElementById("tabelaEstoques"), 4, "Nenhum item cadastrado no estoque.");
                    return;
                }

                const grupos = new Map();
                estoques.forEach(estoque => {
                    const chave = chaveCategoria(estoque.categoria);
                    if (!grupos.has(chave)) {
                        grupos.set(chave, []);
                    }
                    grupos.get(chave).push(estoque);
                });

                const ordem = ["ALIMENTOS", "VESTUARIO"];
                const chaves = [
                    ...ordem.filter(chave => grupos.has(chave)),
                    ...[...grupos.keys()].filter(chave => !ordem.includes(chave)).sort()
                ];

                chaves.forEach(chave => {
                    const itens = grupos.get(chave);
                    const tabelaId = "tabelaEstoque-" + chave;
                    lista.innerHTML += `
                        <section class="secao-estoque" data-categoria="${textoSeguro(chave)}">
                            <div class="cabecalho-secao">
                                <h3>${textoSeguro(rotuloCategoria(chave))}</h3>
                                <span>${itens.length} item(ns)</span>
                            </div>
                            <section class="card-tabela">
                                <table>
                                    <colgroup>
                                        <col class="col-id">
                                        <col>
                                        <col class="col-qtd">
                                        <col class="col-acoes">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Descrição</th>
                                        <th>Quantidade</th>
                                        <th>Ações</th>
                                    </tr>
                                    </thead>
                                    <tbody id="${tabelaId}">
                                        ${itens.map(linhaEstoque).join("")}
                                    </tbody>
                                </table>
                            </section>
                        </section>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar estoque: " + error.message);
            });
    }

    function filtrarEstoques(campo) {
        const termo = String(campo.value ?? "").trim().toLowerCase();

        document.querySelectorAll(".secao-estoque").forEach(secao => {
            let visiveis = 0;

            secao.querySelectorAll("tbody tr").forEach(linha => {
                const mostra = termo === "" || linha.textContent.toLowerCase().includes(termo);
                linha.hidden = !mostra;
                if (mostra) {
                    visiveis += 1;
                }
            });

            secao.hidden = visiveis === 0;
        });
    }

    function salvar() {
        const id = document.getElementById("id").value;

        const estoque = {
            descricao: document.getElementById("descricao").value,
            quantidade: Number(document.getElementById("quantidade").value),
            categoria: document.getElementById("categoria").value
        };

        const url = id ? `/estoques/${id}` : "/estoques";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(estoque)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Erro ao salvar item de estoque.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
            })
            .then(() => {
                cancelar();
                carregarEstoques();
            })
            .catch(error => {
                mostrarErro("Erro ao salvar item de estoque: " + error.message);
            });
    }

    function editar(id) {
        fetch(`/estoques/${id}`)
            .then(response => response.json())
            .then(estoque => {
                document.getElementById("id").value = estoque.id;
                document.getElementById("descricao").value = estoque.descricao ?? "";
                document.getElementById("quantidade").value = estoque.quantidade ?? 0;
                document.getElementById("categoria").value = estoque.categoria ?? "";

                document.getElementById("tituloFormulario").innerText = "Editar Item de Estoque";
                mostrarFormulario();
            })
            .catch(error => {
                mostrarErro("Erro ao buscar item de estoque: " + error.message);
            });
    }

    function excluir(id) {
        if (!confirm("Deseja realmente excluir este item de estoque?")) {
            return;
        }

        fetch(`/estoques/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Não foi possível excluir o item de estoque.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }

                carregarEstoques();
            })
            .catch(error => {
                mostrarErro("Erro ao excluir item de estoque: " + error.message);
            });
    }

    carregarEstoques();
</script>

</body>
</html>
