<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="app-shell" th:fragment="appHeader">
    <script>
        document.documentElement.setAttribute(
            "data-tema",
            localStorage.getItem("solidarioTema") === "escuro" ? "escuro" : "claro"
        );
        document.body.classList.add("com-sidebar");
        if (localStorage.getItem("solidarioSidebarRecolhida") === "1") {
            document.body.classList.add("sidebar-recolhida");
        }
    </script>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-marca">
            <a class="marca" href="/menu" aria-label="Ir para a página inicial">
                <span class="marca-simbolo" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21s-7-4.35-9.33-8.52C.82 9.17 2.05 5.2 5.66 4.24A5.1 5.1 0 0 1 12 7.1a5.1 5.1 0 0 1 6.34-2.86c3.61.96 4.84 4.93 2.99 8.24C19 16.65 12 21 12 21Z"/>
                    </svg>
                </span>
                <span class="marca-texto">
                    <strong>Solidário</strong>
                    <small>Gestão de doações</small>
                </span>
            </a>

            <button class="botao-sidebar" id="botaoSidebar" type="button"
                    aria-controls="sidebar" aria-label="Recolher menu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 6 9 12l6 6"/>
                </svg>
            </button>
        </div>

        <nav class="links-navegacao" id="linksNavegacao" aria-label="Navegação principal">
            <div class="grupo-navegacao">
                <span class="rotulo-navegacao">Visão geral</span>
                <a href="/menu" title="Dashboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-6v-5H10v5H4z"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="/tela-relatorios" title="Relatórios">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9h3v10H5Zm6 0V5h3v14h-3Zm6 0v-7h3v7h-3Z"/></svg>
                    <span>Relatórios</span>
                </a>
            </div>

            <div class="grupo-navegacao">
                <span class="rotulo-navegacao">Operação</span>
                <a href="/tela-doacoes" data-permissao="DOACAO" title="Doações">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-8.5C.8 9.2 2 5.2 5.7 4.2A5 5 0 0 1 12 7a5 5 0 0 1 6.3-2.8c3.6 1 4.8 5 3 8.3C19 16.6 12 21 12 21Z"/></svg>
                    <span>Doações</span>
                </a>
                <a href="/tela-campanhas" data-permissao="DOACAO" title="Campanhas">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V9l7-4 7 4v11H5Z"/><path d="M9 20v-6h6v6"/></svg>
                    <span>Campanhas</span>
                </a>
                <a href="/tela-distribuicoes" data-permissao="DISTRIBUICAO" title="Distribuições">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3zm11 3h4l3 3v4h-7zM7 20a1.6 1.6 0 1 0 0-3.2A1.6 1.6 0 0 0 7 20Zm10 0a1.6 1.6 0 1 0 0-3.2A1.6 1.6 0 0 0 17 20Z"/></svg>
                    <span>Distribuições</span>
                </a>
                <a href="/tela-estoques" data-permissao="ESTOQUE" title="Estoque">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 12 4l8 4-8 4-8-4Zm0 4.5 8 4 8-4M4 17l8 4 8-4"/></svg>
                    <span>Estoque</span>
                </a>
            </div>

            <div class="grupo-navegacao">
                <span class="rotulo-navegacao">Pessoas</span>
                <a href="/tela-doadores" data-permissao="DOADOR" title="Doadores">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-7 8v-1.2C5 16 8 14.5 12 14.5s7 1.5 7 4.3V20Z"/></svg>
                    <span>Doadores</span>
                </a>
                <a href="/tela-receptores" data-permissao="RECEPTOR" title="Receptores">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.2 3.2 0 1 0-3.2-3.2A3.2 3.2 0 0 0 9 11Zm9.2 0A3.2 3.2 0 1 0 15 7.8 3.2 3.2 0 0 0 18.2 11ZM2.8 19v-.9C2.8 16.2 5.4 15 9 15s6.2 1.2 6.2 3.1v.9Zm10.5 0v-.8c0-1.1.5-2 1.3-2.7 1.2.3 4.4.8 4.4 2.6V19Z"/></svg>
                    <span>Receptores</span>
                </a>
            </div>

            <div class="grupo-navegacao">
                <span class="rotulo-navegacao">Cadastros</span>
                <a href="/tela-tipos-doacao" data-permissao="TIPO_DOACAO" title="Tipos">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v4H5zm0 6h9v4H5zm0 6h14v4H5z"/></svg>
                    <span>Tipos</span>
                </a>
                <a href="/tela-tamanhos-roupa" data-permissao="TAMANHOS" title="Tamanhos">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l3 5-7 11L5 9Zm4 0v16"/></svg>
                    <span>Tamanhos</span>
                </a>
                <a href="/tela-usuarios" data-admin-only="true" title="Usuários">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm7.5 2.2-1.3-.4a2 2 0 0 1-1.2-1.2l-.3-1.1-1.2.6a4.6 4.6 0 0 1-1.7.5V15h-2.4v-1.4a4.6 4.6 0 0 1-1.7-.5l-1.2-.6-.3 1.1a2 2 0 0 1-1.2 1.2l-1.3.4.8 2.2 1.4-.2a2 2 0 0 1 1.6.7l.8 1.1h2.4l.8-1.1a2 2 0 0 1 1.6-.7l1.4.2Z"/></svg>
                    <span>Usuários</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-rodape">
            <div class="perfil-usuario">
                <span class="avatar-usuario" id="avatarUsuario" aria-hidden="true">U</span>
                <span class="dados-usuario">
                    <strong id="nomeUsuario">Usuário</strong>
                    <small id="perfilUsuario">Perfil</small>
                </span>
            </div>
            <button class="botao-tema" id="botaoTema" type="button" title="Alternar tema">
                <span class="interruptor-tema" aria-hidden="true">
                    <svg class="icone-tema-claro" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                    </svg>
                    <svg class="icone-tema-escuro" viewBox="0 0 24 24">
                        <path d="M16.5 13A6.5 6.5 0 0 1 11 4.2 7.5 7.5 0 1 0 19.8 13a6.4 6.4 0 0 1-3.3 0Z"/>
                    </svg>
                </span>
                <span class="rotulo-tema" id="rotuloTema">Modo escuro</span>
            </button>
            <button class="botao-sair" type="button" onclick="sair()">Sair</button>
        </div>
    </aside>

    <header class="topo-pagina">
        <button class="botao-menu-mobile" id="botaoMenuMobile" type="button"
                aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>Menu</span>
        </button>

        <button class="botao-retorno" id="botaoRetorno" type="button"
                onclick="voltarPagina()" aria-label="Voltar à página anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            <span>Voltar</span>
        </button>
    </header>

    <div class="sidebar-fundo" id="sidebarFundo" hidden></div>
</div>
</body>
</html>
