<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Distribuições</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navigation :: appHeader}"></div>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Distribuições cadastradas</h2>
            <p class="descricao">Registre as entregas de doações realizadas aos receptores.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Nova Distribuição</button>
    </div>

    <div class="barra-lista">
        <input type="search" placeholder="Buscar distribuição..."
               oninput="filtrarTabela(this, 'tabelaDistribuicoes')"
               aria-label="Buscar distribuições">
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Nova Distribuição</h3>

        <input type="hidden" id="id">

        <div class="form-grid">

            <div>
                <label>Receptor</label>
                <select id="idReceptor" onchange="mostrarEnderecoReceptor()">
                    <option value="">Selecione um receptor</option>
                </select>
            </div>

            <div class="campo-completo destino-entrega" id="caixaEnderecoReceptor" hidden>
                <strong>Endereço de entrega</strong>
                <p id="enderecoReceptor">—</p>
            </div>

            <div>
                <label>Item do Estoque</label>
                <select id="idEstoque">
                    <option value="">Selecione um item</option>
                </select>
            </div>

            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidade" placeholder="Quantidade" min="1">
            </div>

            <div>
                <label>Data da Distribuição</label>
                <input type="date" id="dataDistribuicao">
            </div>

            <div class="campo-completo">
                <label>Observação</label>
                <textarea id="observacao" placeholder="Observações"></textarea>
            </div>

        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <section class="card-tabela">
        <table>
            <colgroup>
                <col class="col-id">
                <col>
                <col>
                <col class="col-qtd">
                <col class="col-data">
                <col class="col-acoes">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th>
                <th>Receptor</th>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaDistribuicoes">
            </tbody>
        </table>
    </section>

</main>

<script>
    let mapaReceptores = {};
    let destinosReceptores = {};
    let mapaEstoques = {};
    let mapaQuantidadesEstoque = {};
    let estoqueOriginalId = null;
    let quantidadeOriginal = 0;

    function dataHoje() {
        return new Date().toISOString().substring(0, 10);
    }

    function formatarData(data) {
        if (!data) {
            return "";
        }

        const somenteData = String(data).substring(0, 10);

        if (somenteData.includes("-")) {
            const partes = somenteData.split("-");
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        return data;
    }

    function novoCadastro() {
        limparFormulario();
        document.getElementById("dataDistribuicao").value = dataHoje();
        document.getElementById("tituloFormulario").innerText = "Nova Distribuição";
        mostrarFormulario();
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("idReceptor").value = "";
        document.getElementById("idEstoque").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("dataDistribuicao").value = "";
        document.getElementById("observacao").value = "";
        estoqueOriginalId = null;
        quantidadeOriginal = 0;
        const caixa = document.getElementById("caixaEnderecoReceptor");
        if (caixa) {
            caixa.hidden = true;
        }
    }

    function mostrarEnderecoReceptor() {
        const receptor = destinosReceptores[document.getElementById("idReceptor").value];
        const caixa = document.getElementById("caixaEnderecoReceptor");
        const texto = document.getElementById("enderecoReceptor");

        if (!receptor) {
            caixa.hidden = true;
            return;
        }

        caixa.hidden = false;
        texto.textContent = receptor.endereco && receptor.endereco.trim() !== ""
            ? receptor.endereco
            : "Este receptor ainda não tem endereço cadastrado.";
    }

    function carregarReceptores() {
        return fetch("/receptores")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar receptores.");
                }

                return response.json();
            })
            .then(receptores => {
                const combo = document.getElementById("idReceptor");
                combo.innerHTML = '<option value="">Selecione um receptor</option>';

                mapaReceptores = {};
                destinosReceptores = {};

                receptores.forEach(receptor => {
                    mapaReceptores[receptor.id] = receptor.nome;
                    destinosReceptores[receptor.id] = receptor;
                    const endereco = receptor.endereco ? ` — ${receptor.endereco}` : "";

                    combo.innerHTML += `
                        <option value="${receptor.id}">
                            ${textoSeguro(receptor.nome)}${textoSeguro(endereco)}
                        </option>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar receptores: " + error.message);
            });
    }

    function carregarEstoques() {
        return fetch("/estoques")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar estoque.");
                }

                return response.json();
            })
            .then(estoques => {
                const combo = document.getElementById("idEstoque");
                combo.innerHTML = '<option value="">Selecione um item</option>';

                mapaEstoques = {};
                mapaQuantidadesEstoque = {};

                estoques.forEach(estoque => {
                    const quantidade = estoque.quantidade ?? 0;

                    mapaEstoques[estoque.id] = estoque.descricao;
                    mapaQuantidadesEstoque[estoque.id] = quantidade;

                    if (quantidade <= 0) {
                        combo.innerHTML += `
                            <option value="${estoque.id}" disabled>
                                ${textoSeguro(estoque.descricao)} - Sem estoque
                            </option>
                        `;
                    } else {
                        combo.innerHTML += `
                            <option value="${estoque.id}">
                                ${textoSeguro(estoque.descricao)} - Estoque: ${quantidade}
                            </option>
                        `;
                    }
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar estoque: " + error.message);
            });
    }

    function carregarDistribuicoes() {
        fetch("/distribuicoes")
            .then(response => {
                if (!response.ok) {
                    return response.text().then(texto => {
                        throw new Error(texto || "Erro ao buscar distribuições.");
                    });
                }

                return response.json();
            })
            .then(distribuicoes => {
                if (!Array.isArray(distribuicoes)) {
                    console.log("Retorno recebido em /distribuicoes:", distribuicoes);
                    throw new Error("O backend não retornou uma lista de distribuições.");
                }

                const tabela = document.getElementById("tabelaDistribuicoes");
                tabela.innerHTML = "";

                if (distribuicoes.length === 0) {
                    tabelaVazia(tabela, 6, "Nenhuma distribuição cadastrada ainda.");
                    return;
                }

                distribuicoes.forEach(distribuicao => {
                    const receptorId =
                        distribuicao.receptorId ??
                        distribuicao.idReceptor ??
                        distribuicao.id_receptor ??
                        distribuicao.receptor?.id ??
                        "";

                    const estoqueId =
                        distribuicao.estoqueId ??
                        distribuicao.idEstoque ??
                        distribuicao.id_estoque ??
                        distribuicao.estoque?.id ??
                        "";

                    const nomeReceptor =
                        distribuicao.nomeReceptor ??
                        distribuicao.receptorNome ??
                        distribuicao.receptor?.nome ??
                        mapaReceptores[receptorId] ??
                        "";

                    const itemEstoque =
                        distribuicao.descricaoEstoque ??
                        distribuicao.estoqueDescricao ??
                        distribuicao.estoque?.descricao ??
                        mapaEstoques[estoqueId] ??
                        "";

                    const dataDistribuicao =
                        distribuicao.dataDistribuicao ??
                        distribuicao.data_distribuicao ??
                        distribuicao.data ??
                        "";

                    tabela.innerHTML += `
                        <tr>
                            <td>${distribuicao.id}</td>
                            <td>${textoSeguro(nomeReceptor)}</td>
                            <td>${textoSeguro(itemEstoque)}</td>
                            <td>${distribuicao.quantidade ?? 0}</td>
                            <td>${formatarData(dataDistribuicao)}</td>
                            <td>
                                <button class="btn-tabela btn-azul" onclick="editar(${distribuicao.id})">Editar</button>
                                <button class="btn-tabela btn-vermelho" onclick="excluir(${distribuicao.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar distribuições: " + error.message);
            });
    }

    function salvar() {
        const id = document.getElementById("id").value;
        const receptorId = Number(document.getElementById("idReceptor").value);
        const estoqueId = Number(document.getElementById("idEstoque").value);
        const quantidade = Number(document.getElementById("quantidade").value);
        const dataDistribuicao = document.getElementById("dataDistribuicao").value;

        if (!receptorId) {
            mostrarErro("Selecione um receptor.");
            return;
        }

        if (!estoqueId) {
            mostrarErro("Selecione um item do estoque.");
            return;
        }

        if (!quantidade || quantidade <= 0) {
            mostrarErro("Informe uma quantidade válida.");
            return;
        }

        let quantidadeDisponivel = mapaQuantidadesEstoque[estoqueId] ?? 0;

        if (id && Number(estoqueOriginalId) === estoqueId) {
            quantidadeDisponivel += quantidadeOriginal;
        }

        if (quantidadeDisponivel <= 0) {
            mostrarErro("Este item está sem saldo em estoque. Não é possível realizar a distribuição.");
            return;
        }

        if (quantidade > quantidadeDisponivel) {
            mostrarErro(
                "Quantidade maior que o estoque disponível. " +
                "Saldo atual: " + quantidadeDisponivel
            );
            return;
        }

        if (!dataDistribuicao) {
            mostrarErro("Informe a data da distribuição.");
            return;
        }

        const distribuicao = {
            receptorId: receptorId,
            estoqueId: estoqueId,
            quantidade: quantidade,
            dataDistribuicao: dataDistribuicao,
            data: dataDistribuicao,
            observacao: document.getElementById("observacao").value
        };

        const url = id ? `/distribuicoes/${id}` : "/distribuicoes";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(distribuicao)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Erro ao salvar distribuição.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
            })
            .then(() => {
                cancelar();

                return Promise.all([
                    carregarReceptores(),
                    carregarEstoques()
                ]);
            })
            .then(() => {
                carregarDistribuicoes();
            })
            .catch(error => {
                mostrarErro(error.message);
            });
    }

    function editar(id) {
        fetch(`/distribuicoes/${id}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar distribuição.");
                }

                return response.json();
            })
            .then(distribuicao => {
                const receptorId =
                    distribuicao.receptorId ??
                    distribuicao.idReceptor ??
                    distribuicao.id_receptor ??
                    distribuicao.receptor?.id ??
                    "";

                const estoqueId =
                    distribuicao.estoqueId ??
                    distribuicao.idEstoque ??
                    distribuicao.id_estoque ??
                    distribuicao.estoque?.id ??
                    "";

                const dataDistribuicao =
                    distribuicao.dataDistribuicao ??
                    distribuicao.data_distribuicao ??
                    distribuicao.data ??
                    "";

                document.getElementById("id").value = distribuicao.id;
                document.getElementById("idReceptor").value = receptorId;
                mostrarEnderecoReceptor();
                document.getElementById("idEstoque").value = estoqueId;
                document.getElementById("quantidade").value = distribuicao.quantidade ?? "";
                document.getElementById("dataDistribuicao").value = String(dataDistribuicao).substring(0, 10);
                document.getElementById("observacao").value = distribuicao.observacao ?? "";
                estoqueOriginalId = Number(estoqueId) || null;
                quantidadeOriginal = Number(distribuicao.quantidade) || 0;

                document.getElementById("tituloFormulario").innerText = "Editar Distribuição";
                mostrarFormulario();
            })
            .catch(error => {
                mostrarErro("Erro ao buscar distribuição: " + error.message);
            });
    }

    function excluir(id) {
        if (!confirm("Deseja realmente excluir esta distribuição?")) {
            return;
        }

        fetch(`/distribuicoes/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível excluir a distribuição.");
                }

                return Promise.all([
                    carregarReceptores(),
                    carregarEstoques()
                ]);
            })
            .then(() => {
                carregarDistribuicoes();
            })
            .catch(error => {
                mostrarErro("Erro ao excluir distribuição: " + error.message);
            });
    }

    Promise.all([
        carregarReceptores(),
        carregarEstoques()
    ]).then(() => {
        carregarDistribuicoes();
    });
</script>

</body>
</html>
