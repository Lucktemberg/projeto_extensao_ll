<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Usuários</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navigation :: appHeader}"></div>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Usuários cadastrados</h2>
            <p class="descricao">Cadastre usuários, defina perfis e libere os módulos do sistema.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Novo Usuário</button>
    </div>

    <div class="barra-lista">
        <input type="search" placeholder="Buscar usuário..."
               oninput="filtrarTabela(this, 'tabelaUsuarios')"
               aria-label="Buscar usuários">
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Novo Usuário</h3>

        <input type="hidden" id="id">

        <div class="form-grid">

            <div>
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Nome do usuário">
            </div>

            <div>
                <label>Login</label>
                <input type="text" id="login" placeholder="Login de acesso">
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha"
                       placeholder="Informe uma senha no novo cadastro">
                <small class="ajuda-campo">Na edição, deixe em branco para manter a senha atual.</small>
            </div>

            <div>
                <label>Perfil</label>
                <select id="perfil" onchange="controlarPermissoes()">
                    <option value="ADMIN">ADMIN</option>
                    <option value="USUARIO">USUARIO</option>
                </select>
            </div>

            <div class="campo-completo" id="areaPermissoes">
                <label>Permissões do usuário</label>

                <div class="permissoes-grid">
                    <label>
                        <input type="checkbox" value="TIPO_DOACAO">
                        Tipo de Doação
                    </label>

                    <label>
                        <input type="checkbox" value="TAMANHOS">
                        Tamanhos
                    </label>

                    <label>
                        <input type="checkbox" value="ESTOQUE">
                        Estoque
                    </label>

                    <label>
                        <input type="checkbox" value="DOADOR">
                        Doador
                    </label>

                    <label>
                        <input type="checkbox" value="RECEPTOR">
                        Receptor
                    </label>

                    <label>
                        <input type="checkbox" value="DOACAO">
                        Doação / Campanhas
                    </label>

                    <label>
                        <input type="checkbox" value="DISTRIBUICAO">
                        Distribuição
                    </label>
                </div>
            </div>

        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <section class="card-tabela">
        <table>
            <colgroup>
                <col class="col-id">
                <col>
                <col>
                <col class="col-perfil">
                <col>
                <col class="col-acoes">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Login</th>
                <th>Perfil</th>
                <th>Permissões</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaUsuarios">
            </tbody>
        </table>
    </section>

</main>

<script>
    const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado") || "null");

    function novoCadastro() {
        limparFormulario();
        document.getElementById("tituloFormulario").innerText = "Novo Usuário";
        mostrarFormulario();
        controlarPermissoes();
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("login").value = "";
        document.getElementById("senha").value = "";
        document.getElementById("perfil").value = "ADMIN";

        document.querySelectorAll("#areaPermissoes input[type='checkbox']").forEach(check => {
            check.checked = false;
        });
    }

    function controlarPermissoes() {
        const perfil = document.getElementById("perfil").value;
        const areaPermissoes = document.getElementById("areaPermissoes");

        if (perfil === "ADMIN") {
            areaPermissoes.style.display = "none";

            document.querySelectorAll("#areaPermissoes input[type='checkbox']").forEach(check => {
                check.checked = false;
            });
        } else {
            areaPermissoes.style.display = "block";
        }
    }

    function permissoesSelecionadas() {
        const permissoes = [];

        document.querySelectorAll("#areaPermissoes input[type='checkbox']:checked").forEach(check => {
            permissoes.push(check.value);
        });

        return permissoes;
    }

    function carregarUsuarios() {
        fetch("/usuarios")
            .then(response => response.json())
            .then(usuarios => {
                const tabela = document.getElementById("tabelaUsuarios");
                tabela.innerHTML = "";

                if (usuarios.length === 0) {
                    tabelaVazia(tabela, 6, "Nenhum usuário cadastrado ainda.");
                    return;
                }

                usuarios.forEach(usuario => {
                    const permissoes = usuario.permissoes ?? [];

                    tabela.innerHTML += `
                        <tr>
                            <td>${usuario.id}</td>
                            <td>${textoSeguro(usuario.nome)}</td>
                            <td>${textoSeguro(usuario.login)}</td>
                            <td>${textoSeguro(usuario.perfil)}</td>
                            <td>${textoSeguro(permissoes.length > 0 ? permissoes.join(", ") : "-")}</td>
                            <td>
                                <button class="btn-tabela btn-azul" onclick="editar(${usuario.id})">Editar</button>
                                <button class="btn-tabela btn-vermelho" onclick="excluir(${usuario.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar usuários: " + error.message);
            });
    }

    function salvar() {
        const id = document.getElementById("id").value;
        const senha = document.getElementById("senha").value;

        if (!id && !senha.trim()) {
            mostrarErro("Informe uma senha para o novo usuário.");
            return;
        }

        const usuario = {
            nome: document.getElementById("nome").value,
            login: document.getElementById("login").value,
            senha: senha,
            perfil: document.getElementById("perfil").value,
            permissoes: permissoesSelecionadas()
        };

        const url = id ? `/usuarios/${id}` : "/usuarios";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(usuario)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Erro ao salvar usuário.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
            })
            .then(() => {
                cancelar();
                carregarUsuarios();
            })
            .catch(error => {
                mostrarErro("Erro ao salvar usuário: " + error.message);
            });
    }

    function editar(id) {
        fetch(`/usuarios/${id}`)
            .then(response => response.json())
            .then(usuario => {
                document.getElementById("id").value = usuario.id;
                document.getElementById("nome").value = usuario.nome ?? "";
                document.getElementById("login").value = usuario.login ?? "";
                document.getElementById("senha").value = "";
                document.getElementById("perfil").value = usuario.perfil ?? "USUARIO";

                document.querySelectorAll("#areaPermissoes input[type='checkbox']").forEach(check => {
                    check.checked = false;
                });

                const permissoes = usuario.permissoes ?? [];

                document.querySelectorAll("#areaPermissoes input[type='checkbox']").forEach(check => {
                    if (permissoes.includes(check.value)) {
                        check.checked = true;
                    }
                });

                controlarPermissoes();

                document.getElementById("tituloFormulario").innerText = "Editar Usuário";
                mostrarFormulario();
            })
            .catch(error => {
                mostrarErro("Erro ao buscar usuário: " + error.message);
            });
    }

    function excluir(id) {
        if (usuarioLogado && usuarioLogado.id === id) {
            mostrarErro("Você não pode excluir o usuário que está logado.");
            return;
        }

        if (!confirm("Deseja realmente excluir este usuário?")) {
            return;
        }

        fetch(`/usuarios/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível excluir o usuário.");
                }

                carregarUsuarios();
            })
            .catch(error => {
                mostrarErro("Erro ao excluir usuário: " + error.message);
            });
    }

    carregarUsuarios();
</script>

</body>
</html>
