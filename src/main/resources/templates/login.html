<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Login</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script>
        document.documentElement.setAttribute(
            "data-tema",
            localStorage.getItem("solidarioTema") === "escuro" ? "escuro" : "claro"
        );
    </script>
</head>
<body class="login-body">

<div class="login-container">

    <div class="login-brand">
        <div class="logo-circle">❤</div>
        <h1>SOLIDÁRIO</h1>
        <p>Sistema de Gestão de Doações</p>
        <span>Organizando solidariedade,<br>conectando doações a quem mais precisa.</span>
    </div>

    <div class="login-card">
        <div class="login-topo">
            <div>
                <h2>Acessar conta</h2>
                <p>Informe suas credenciais para continuar</p>
            </div>
            <button class="botao-tema-login" id="botaoTemaLogin" type="button"
                    title="Alternar tema">
                <svg class="icone-tema-claro" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
                <svg class="icone-tema-escuro" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16.5 13A6.5 6.5 0 0 1 11 4.2 7.5 7.5 0 1 0 19.8 13a6.4 6.4 0 0 1-3.3 0Z"/>
                </svg>
                <span id="rotuloTemaLogin">Escuro</span>
            </button>
        </div>

        <form onsubmit="entrar(event)">
            <label for="login">Login</label>
            <input type="text" id="login" placeholder="Digite seu login"
                   autocomplete="username" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha"
                   autocomplete="current-password" required>

            <button type="submit">Entrar no Sistema</button>
        </form>

        <a class="login-acompanhar" href="/acompanhar">Acompanhar uma doação</a>

        <div id="mensagem" class="mensagem-erro"></div>
    </div>

</div>

<script>
    fetch("/usuarios/me").then(resposta => {
        if (resposta.ok) {
            return resposta.json();
        }
        return null;
    }).then(usuario => {
        if (usuario) {
            localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
            window.location.replace("/menu");
        }
    }).catch(() => {});

    const botaoTemaLogin = document.getElementById("botaoTemaLogin");
    atualizarRotuloTemaLogin();
    botaoTemaLogin.addEventListener("click", function () {
        const escuro = document.documentElement.getAttribute("data-tema") !== "escuro";
        const tema = escuro ? "escuro" : "claro";
        document.documentElement.setAttribute("data-tema", tema);
        localStorage.setItem("solidarioTema", tema);
        atualizarRotuloTemaLogin();
    });

    function atualizarRotuloTemaLogin() {
        const escuro = document.documentElement.getAttribute("data-tema") === "escuro";
        document.getElementById("rotuloTemaLogin").textContent = escuro ? "Claro" : "Escuro";
        botaoTemaLogin.setAttribute("title", escuro ? "Usar modo claro" : "Usar modo escuro");
        botaoTemaLogin.setAttribute("aria-label", escuro ? "Usar modo claro" : "Usar modo escuro");
    }

    function entrar(event) {
        event.preventDefault();

        const login = document.getElementById("login").value;
        const senha = document.getElementById("senha").value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                login: login,
                senha: senha
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Login ou senha inválidos.");
                }
                return response.json();
            })
            .then(usuario => {
                localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
                mostrarAviso("Acesso liberado. Entrando...");
                window.location.href = "/menu";
            })
            .catch(error => {
                document.getElementById("mensagem").innerText = error.message;
                mostrarErro(error.message);
            });
    }
</script>

</body>
</html>
