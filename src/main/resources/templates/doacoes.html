<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Doações</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navigation :: appHeader}"></div>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Doações cadastradas</h2>
            <p class="descricao">Registre a doação, avance as etapas e compartilhe o código de acompanhamento com o doador.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Nova Doação</button>
    </div>

    <div class="barra-lista">
        <input type="search" placeholder="Buscar doação..."
               oninput="filtrarTabela(this, 'tabelaDoacoes')"
               aria-label="Buscar doações">
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Nova Doação</h3>

        <input type="hidden" id="id">

        <div class="form-grid">

            <div>
                <label>Doador</label>
                <select id="idDoador">
                    <option value="">Selecione um doador</option>
                </select>
            </div>

            <div>
                <label>Categoria</label>
                <select id="categoria" onchange="controlarCamposCategoria(true)">
                    <option value="">Selecione uma categoria</option>
                    <option value="ALIMENTOS">ALIMENTOS</option>
                    <option value="VESTUARIO">VESTUÁRIO</option>
                </select>
            </div>

            <div>
                <label>Tipo de Doação</label>
                <input
                        type="text"
                        id="descricaoItem"
                        list="listaTiposDoacao"
                        placeholder="Selecione primeiro uma categoria"
                >
                <datalist id="listaTiposDoacao"></datalist>
            </div>

            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidade" placeholder="Quantidade" min="1">
            </div>

            <div id="campoTamanho">
                <label>Tamanho</label>
                <select id="tamanho">
                    <option value="">Selecione o tamanho</option>
                    <option value="PP">PP</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                    <option value="XG">XG</option>
                    <option value="INFANTIL">INFANTIL</option>
                </select>
            </div>

            <div id="campoUnidade">
                <label>Unidade</label>
                <select id="unidade">
                    <option value="">Selecione a unidade</option>
                    <option value="UN">UN</option>
                    <option value="KG">KG</option>
                    <option value="PACOTE">PACOTE</option>
                    <option value="CAIXA">CAIXA</option>
                    <option value="LITRO">LITRO</option>
                </select>
            </div>

            <div>
                <label>Campanha</label>
                <select id="campanhaId">
                    <option value="">Sem campanha</option>
                </select>
            </div>

            <div>
                <label>Data da Doação</label>
                <input type="date" id="dataDoacao">
            </div>

            <div id="campoDetalheUnidade">
                <label>Detalhe da Unidade</label>
                <input type="text" id="detalheUnidade" placeholder="Ex: 5kg, pacote fechado">
            </div>

            <div class="campo-completo">
                <label>Observação</label>
                <textarea id="observacao" placeholder="Observações"></textarea>
            </div>

        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <section class="card-form" id="formularioDistribuicao" style="display: none;">
        <h3>Entregar doação</h3>
        <input type="hidden" id="doacaoDistribuirId">

        <p class="descricao" id="resumoDistribuicao"></p>

        <div class="form-grid">
            <div class="campo-completo">
                <label>Receptor</label>
                <select id="receptorDistribuicao" onchange="mostrarEnderecoReceptor()">
                    <option value="">Selecione quem vai receber</option>
                </select>
            </div>

            <div class="campo-completo destino-entrega" id="caixaEnderecoReceptor" hidden>
                <strong>Endereço de entrega</strong>
                <p id="enderecoReceptor">—</p>
                <small id="telefoneReceptor"></small>
            </div>

            <div>
                <label>Quantidade</label>
                <input type="number" id="quantidadeDistribuicao" min="1" placeholder="Quantidade">
                <small id="ajudaQuantidadeDistribuicao" class="ajuda-campo"></small>
            </div>

            <div>
                <label>Data da entrega</label>
                <input type="date" id="dataDistribuicaoDoacao">
            </div>

            <div class="campo-completo">
                <label>Observação</label>
                <textarea id="observacaoDistribuicao" placeholder="Observações da entrega"></textarea>
            </div>
        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" type="button" onclick="cancelarDistribuicao()">Cancelar</button>
            <button class="btn btn-verde" type="button" onclick="confirmarDistribuicao()">Confirmar entrega</button>
        </div>
    </section>

    <section class="card-tabela">
        <table class="tabela-acoes-amplas">
            <colgroup>
                <col>
                <col>
                <col>
                <col class="col-status">
                <col class="col-codigo">
                <col class="col-qtd">
                <col class="col-acoes">
            </colgroup>
            <thead>
            <tr>
                <th>Doador</th>
                <th>Item</th>
                <th>Campanha</th>
                <th>Status</th>
                <th>Código</th>
                <th>Qtd</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaDoacoes">
            </tbody>
        </table>
    </section>

</main>

<script>
    let tiposDoacao = [];
    let campanhaSugerida = null;
    let destinosEntrega = [];

    function dataHoje() {
        return new Date().toISOString().substring(0, 10);
    }

    function formatarData(data) {
        if (!data) {
            return "";
        }

        const somenteData = String(data).substring(0, 10);

        if (somenteData.includes("-")) {
            const partes = somenteData.split("-");
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        return data;
    }

    function normalizarTexto(texto) {
        return String(texto ?? "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toUpperCase()
            .trim();
    }

    function carregarTiposDoacao() {
        return fetch("/tipos-doacao")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar tipos de doação.");
                }

                return response.json();
            })
            .then(tipos => {
                tiposDoacao = tipos;
            })
            .catch(error => {
                mostrarErro("Erro ao carregar tipos de doação: " + error.message);
            });
    }

    function carregarTiposPorCategoria(limparCampo = true) {
        const categoria = normalizarTexto(document.getElementById("categoria").value);
        const lista = document.getElementById("listaTiposDoacao");
        const campoDescricao = document.getElementById("descricaoItem");

        lista.innerHTML = "";

        if (limparCampo) {
            campoDescricao.value = "";
        }

        if (!categoria) {
            campoDescricao.placeholder = "Selecione primeiro uma categoria";
            return;
        }

        const tiposFiltrados = tiposDoacao.filter(tipo =>
            normalizarTexto(tipo.categoria) === categoria
        );

        if (tiposFiltrados.length === 0) {
            campoDescricao.placeholder = "Nenhum tipo cadastrado para esta categoria";
            return;
        }

        campoDescricao.placeholder = "Digite para pesquisar o tipo de doação";

        tiposFiltrados.forEach(tipo => {
            lista.innerHTML += `
                <option value="${textoSeguro(tipo.nome)}">
            `;
        });
    }

    function controlarCamposCategoria(limparTipo = true) {
        const categoria = document.getElementById("categoria").value;

        const campoTamanho = document.getElementById("campoTamanho");
        const campoUnidade = document.getElementById("campoUnidade");
        const campoDetalheUnidade = document.getElementById("campoDetalheUnidade");

        if (categoria === "VESTUARIO") {
            campoTamanho.style.display = "block";
            campoUnidade.style.display = "none";
            campoDetalheUnidade.style.display = "none";

            document.getElementById("unidade").value = "";
            document.getElementById("detalheUnidade").value = "";
        } else if (categoria === "ALIMENTOS") {
            campoTamanho.style.display = "none";
            campoUnidade.style.display = "block";
            campoDetalheUnidade.style.display = "block";

            document.getElementById("tamanho").value = "";
        } else {
            campoTamanho.style.display = "none";
            campoUnidade.style.display = "none";
            campoDetalheUnidade.style.display = "none";

            document.getElementById("tamanho").value = "";
            document.getElementById("unidade").value = "";
            document.getElementById("detalheUnidade").value = "";
        }

        carregarTiposPorCategoria(limparTipo);
    }

    function novoCadastro() {
        limparFormulario();
        document.getElementById("dataDoacao").value = dataHoje();
        document.getElementById("tituloFormulario").innerText = "Nova Doação";
        mostrarFormulario();
        controlarCamposCategoria(true);
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("idDoador").value = "";
        document.getElementById("descricaoItem").value = "";
        document.getElementById("quantidade").value = "";
        document.getElementById("categoria").value = "";
        document.getElementById("dataDoacao").value = "";
        document.getElementById("tamanho").value = "";
        document.getElementById("unidade").value = "";
        document.getElementById("detalheUnidade").value = "";
        document.getElementById("observacao").value = "";
        document.getElementById("campanhaId").value = campanhaSugerida || "";
        controlarCamposCategoria(true);
    }

    function carregarCampanhas() {
        return fetch("/campanhas?ativas=true")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar campanhas.");
                }
                return response.json();
            })
            .then(campanhas => {
                const combo = document.getElementById("campanhaId");
                combo.innerHTML = '<option value="">Sem campanha</option>';
                campanhas.forEach(campanha => {
                    combo.innerHTML += `
                        <option value="${campanha.id}">${textoSeguro(campanha.nome)}</option>
                    `;
                });
                campanhaSugerida = campanhas.length === 1 ? campanhas[0].id : null;
                if (!document.getElementById("id").value && campanhaSugerida) {
                    combo.value = campanhaSugerida;
                }
            })
            .catch(error => {
                mostrarErro("Erro ao carregar campanhas: " + error.message);
            });
    }

    function carregarDoadores() {
        return fetch("/doadores")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar doadores.");
                }

                return response.json();
            })
            .then(doadores => {
                const combo = document.getElementById("idDoador");
                combo.innerHTML = '<option value="">Selecione um doador</option>';

                doadores.forEach(doador => {
                    combo.innerHTML += `
                        <option value="${doador.id}" data-nome="${textoSeguro(doador.nome)}">
                            ${textoSeguro(doador.nome)}
                        </option>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar doadores: " + error.message);
            });
    }

    function carregarDoacoes() {
        fetch("/doacoes")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar doações.");
                }

                return response.json();
            })
            .then(doacoes => {
                const tabela = document.getElementById("tabelaDoacoes");
                tabela.innerHTML = "";

                if (doacoes.length === 0) {
                    tabelaVazia(tabela, 7, "Nenhuma doação cadastrada ainda.");
                    return;
                }

                doacoes.forEach(doacao => {
                    const nomeDoador =
                        doacao.nomeDoador ??
                        doacao.nome_doador ??
                        doacao.doador?.nome ??
                        "";

                    const descricaoItem =
                        doacao.descricaoItem ??
                        doacao.descricao_item ??
                        doacao.descricao ??
                        "";

                    const dataDoacao =
                        doacao.dataDoacao ??
                        doacao.data_doacao ??
                        doacao.data ??
                        "";

                    tabela.innerHTML += `
                        <tr>
                            <td>${textoSeguro(nomeDoador)}</td>
                            <td>${textoSeguro(descricaoItem)}</td>
                            <td>${textoSeguro(doacao.campanhaNome || "-")}</td>
                            <td>
                                <span class="selo-status selo-${textoSeguro((doacao.status || "").toLowerCase())}">
                                    ${textoSeguro(doacao.statusRotulo || doacao.status || "Recebida")}
                                </span>
                            </td>
                            <td>
                                <div class="codigo-doacao">
                                    <code>${textoSeguro(doacao.codigoAcompanhamento || "-")}</code>
                                    ${doacao.codigoAcompanhamento ? `
                                        <button class="btn-tabela btn-cinza" type="button"
                                                onclick="copiarCodigo('${textoSeguro(doacao.codigoAcompanhamento)}')">
                                            Copiar
                                        </button>
                                    ` : ""}
                                </div>
                            </td>
                            <td>${doacao.quantidade ?? 0}</td>
                            <td>
                                ${botoesEtapa(doacao)}
                                ${botoesAviso(doacao)}
                                <button class="btn-tabela btn-azul" onclick="editar(${doacao.id})">Editar</button>
                                <button class="btn-tabela btn-vermelho" onclick="excluir(${doacao.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar doações: " + error.message);
            });
    }

    function salvar() {
        const id = document.getElementById("id").value;

        const doadorSelect = document.getElementById("idDoador");
        const doadorId = Number(doadorSelect.value);
        const nomeDoador =
            doadorSelect.options[doadorSelect.selectedIndex]?.dataset.nome ??
            doadorSelect.options[doadorSelect.selectedIndex]?.text.trim();

        const categoria = document.getElementById("categoria").value;
        const descricaoItem = document.getElementById("descricaoItem").value;
        const quantidade = Number(document.getElementById("quantidade").value);
        const dataDoacao = document.getElementById("dataDoacao").value;

        if (!doadorId) {
            mostrarErro("Selecione um doador.");
            return;
        }

        if (!categoria) {
            mostrarErro("Selecione a categoria da doação.");
            return;
        }

        if (!descricaoItem || descricaoItem.trim() === "") {
            mostrarErro("Informe o tipo de doação.");
            return;
        }

        if (!quantidade || quantidade <= 0) {
            mostrarErro("Informe uma quantidade válida.");
            return;
        }

        if (!dataDoacao) {
            mostrarErro("Informe a data da doação.");
            return;
        }

        if (categoria === "VESTUARIO" && !document.getElementById("tamanho").value) {
            mostrarErro("Informe o tamanho do vestuário.");
            return;
        }

        let unidade = document.getElementById("unidade").value;
        let detalheUnidade = document.getElementById("detalheUnidade").value;
        let tamanho = document.getElementById("tamanho").value;

        if (categoria === "VESTUARIO") {
            unidade = "UN";
            detalheUnidade = "";
        }

        if (categoria === "ALIMENTOS" && !unidade) {
            mostrarErro("Informe a unidade do alimento.");
            return;
        }

        const doacao = {
            doadorId: doadorId,
            idDoador: doadorId,
            nomeDoador: nomeDoador,
            descricaoItem: descricaoItem.trim(),
            quantidade: quantidade,
            categoria: categoria,
            dataDoacao: dataDoacao,
            data: dataDoacao,
            tamanho: tamanho,
            unidade: unidade,
            detalheUnidade: detalheUnidade,
            observacao: document.getElementById("observacao").value,
            campanhaId: document.getElementById("campanhaId").value
                ? Number(document.getElementById("campanhaId").value)
                : null
        };

        const url = id ? `/doacoes/${id}` : "/doacoes";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(doacao)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Erro ao salvar doação.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
                return response.json();
            })
            .then(doacaoSalva => {
                cancelar();
                carregarDoacoes();
                if (!id && doacaoSalva?.codigoAcompanhamento) {
                    mostrarAviso(
                        "Doação cadastrada. Código: "
                        + doacaoSalva.codigoAcompanhamento
                    );
                } else {
                    mostrarAviso("Doação atualizada.");
                }
            })
            .catch(error => {
                mostrarErro("Erro ao salvar doação: " + error.message);
            });
    }

    function editar(id) {
        fetch(`/doacoes/${id}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar doação.");
                }

                return response.json();
            })
            .then(doacao => {
                let idDoador =
                    doacao.doadorId ??
                    doacao.idDoador ??
                    doacao.id_doador ??
                    doacao.doador?.id ??
                    "";

                if (!idDoador && doacao.nomeDoador) {
                    const opcoes = Array.from(
                        document.getElementById("idDoador").options
                    );
                    const opcaoEncontrada = opcoes.find(opcao =>
                        opcao.dataset.nome === doacao.nomeDoador
                    );
                    idDoador = opcaoEncontrada?.value ?? "";
                }

                const descricaoItem =
                    doacao.descricaoItem ??
                    doacao.descricao_item ??
                    doacao.descricao ??
                    "";

                const dataDoacao =
                    doacao.dataDoacao ??
                    doacao.data_doacao ??
                    doacao.data ??
                    "";

                const detalheUnidade =
                    doacao.detalheUnidade ??
                    doacao.detalhe_unidade ??
                    "";

                document.getElementById("id").value = doacao.id;
                document.getElementById("idDoador").value = idDoador;
                document.getElementById("categoria").value = doacao.categoria ?? "";
                controlarCamposCategoria(false);

                document.getElementById("descricaoItem").value = descricaoItem;
                document.getElementById("quantidade").value = doacao.quantidade ?? "";
                document.getElementById("dataDoacao").value = String(dataDoacao).substring(0, 10);
                document.getElementById("tamanho").value = doacao.tamanho ?? "";
                document.getElementById("unidade").value = doacao.unidade ?? "";
                document.getElementById("detalheUnidade").value = detalheUnidade;
                document.getElementById("observacao").value = doacao.observacao ?? "";
                document.getElementById("campanhaId").value = doacao.campanhaId ?? "";

                document.getElementById("tituloFormulario").innerText = "Editar Doação";
                mostrarFormulario();
            })
            .catch(error => {
                mostrarErro("Erro ao buscar doação: " + error.message);
            });
    }

    function excluir(id) {
        if (!confirm("Deseja realmente excluir esta doação?")) {
            return;
        }

        fetch(`/doacoes/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Não foi possível excluir a doação.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }

                carregarDoacoes();
            })
            .catch(error => {
                mostrarErro("Erro ao excluir doação: " + error.message);
            });
    }

    function botoesEtapa(doacao) {
        const status = doacao.status;
        if (status === "CADASTRADA") {
            return `
                <button class="btn-tabela btn-cinza" onclick="avancarStatus(${doacao.id}, 'COLETA_AGENDADA')">Agendar coleta</button>
                <button class="btn-tabela btn-verde" onclick="avancarStatus(${doacao.id}, 'RECEBIDA')">Receber</button>
            `;
        }
        if (status === "COLETA_AGENDADA") {
            return `
                <button class="btn-tabela btn-verde" onclick="avancarStatus(${doacao.id}, 'RECEBIDA')">Receber</button>
            `;
        }
        if (status === "RECEBIDA") {
            return `
                <button class="btn-tabela btn-azul" onclick="abrirDistribuicao(${doacao.id})">Distribuir</button>
            `;
        }
        return "";
    }

    function carregarDestinos() {
        return fetch("/doacoes/destinos")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar receptores.");
                }
                return response.json();
            })
            .then(destinos => {
                destinosEntrega = destinos;
                const combo = document.getElementById("receptorDistribuicao");
                combo.innerHTML = '<option value="">Selecione quem vai receber</option>';
                destinos.forEach(destino => {
                    const endereco = destino.endereco ? ` — ${destino.endereco}` : "";
                    combo.innerHTML += `
                        <option value="${destino.id}">
                            ${textoSeguro(destino.nome)}${textoSeguro(endereco)}
                        </option>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar destinatários: " + error.message);
            });
    }

    function abrirDistribuicao(id) {
        document.getElementById("formulario").style.display = "none";
        fetch(`/doacoes/${id}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao buscar doação.");
                }
                return response.json();
            })
            .then(doacao => {
                document.getElementById("doacaoDistribuirId").value = doacao.id;
                document.getElementById("dataDistribuicaoDoacao").value = dataHoje();
                document.getElementById("observacaoDistribuicao").value = "";
                document.getElementById("receptorDistribuicao").value = "";
                document.getElementById("quantidadeDistribuicao").value = doacao.quantidade ?? 1;
                document.getElementById("quantidadeDistribuicao").max = doacao.quantidade ?? 1;
                document.getElementById("ajudaQuantidadeDistribuicao").textContent =
                    `Disponível nesta doação: ${doacao.quantidade ?? 0}`;
                document.getElementById("resumoDistribuicao").textContent =
                    `${doacao.quantidade}x ${doacao.descricaoItem} disponíveis para entrega.`;
                mostrarEnderecoReceptor();
                const formulario = document.getElementById("formularioDistribuicao");
                formulario.style.display = "block";
                formulario.scrollIntoView({ behavior: "smooth", block: "start" });
            })
            .catch(error => {
                mostrarErro(error.message);
            });
    }

    function mostrarEnderecoReceptor() {
        const destino = destinosEntrega.find(item =>
            String(item.id) === document.getElementById("receptorDistribuicao").value
        );
        const caixa = document.getElementById("caixaEnderecoReceptor");

        if (!destino) {
            caixa.hidden = true;
            return;
        }

        caixa.hidden = false;
        document.getElementById("enderecoReceptor").textContent =
            destino.endereco && destino.endereco.trim() !== ""
                ? destino.endereco
                : "Este receptor ainda não tem endereço cadastrado.";
        document.getElementById("telefoneReceptor").textContent = destino.telefone
            ? "Telefone: " + destino.telefone
            : "";
    }

    function cancelarDistribuicao() {
        document.getElementById("formularioDistribuicao").style.display = "none";
        document.getElementById("doacaoDistribuirId").value = "";
        document.getElementById("receptorDistribuicao").value = "";
        document.getElementById("observacaoDistribuicao").value = "";
        document.getElementById("caixaEnderecoReceptor").hidden = true;
    }

    function confirmarDistribuicao() {
        const id = document.getElementById("doacaoDistribuirId").value;
        const receptorId = Number(document.getElementById("receptorDistribuicao").value);
        const quantidade = Number(document.getElementById("quantidadeDistribuicao").value);
        const destino = destinosEntrega.find(item => item.id === receptorId);
        const maximo = Number(document.getElementById("quantidadeDistribuicao").max);

        if (!receptorId) {
            mostrarErro("Selecione o receptor e confira o endereço de entrega.");
            return;
        }

        if (!destino?.endereco || destino.endereco.trim() === "") {
            mostrarErro("Cadastre o endereço deste receptor antes de confirmar a entrega.");
            return;
        }

        if (!quantidade || quantidade <= 0) {
            mostrarErro("Informe a quantidade que será entregue.");
            return;
        }

        if (quantidade > maximo) {
            mostrarErro("A quantidade não pode ser maior que " + maximo + ".");
            return;
        }

        fetch(`/doacoes/${id}/distribuir`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                receptorId: receptorId,
                quantidade: quantidade,
                dataDistribuicao: document.getElementById("dataDistribuicaoDoacao").value,
                observacao: document.getElementById("observacaoDistribuicao").value
            })
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Não foi possível registrar a entrega.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
                return response.json();
            })
            .then(() => {
                cancelarDistribuicao();
                carregarDoacoes();
                mostrarAviso("Entrega registrada para " + destino.nome + ".");
            })
            .catch(error => {
                mostrarErro(error.message);
            });
    }

    function avancarStatus(id, status) {
        const corpo = { status };
        if (status === "COLETA_AGENDADA") {
            corpo.dataColeta = dataHoje();
        }

        fetch(`/doacoes/${id}/status`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(corpo)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Não foi possível atualizar a etapa.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
                carregarDoacoes();
            })
            .catch(error => {
                mostrarErro(error.message);
            });
    }

    function copiarCodigo(codigo) {
        navigator.clipboard.writeText(codigo)
            .then(() => mostrarAviso("Código copiado: " + codigo))
            .catch(() => mostrarErro("Não foi possível copiar o código."));
    }

    function botoesAviso(doacao) {
        let html = "";
        if (linkSeguro(doacao.linkWhatsapp, ["https://wa.me/"])) {
            html += `<a class="btn-tabela btn-verde" href="${doacao.linkWhatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;
        }
        if (linkSeguro(doacao.linkEmail, ["mailto:"])) {
            html += `<a class="btn-tabela btn-cinza" href="${doacao.linkEmail}">E-mail</a>`;
        }
        return html;
    }

    function linkSeguro(url, prefixos) {
        return typeof url === "string" && prefixos.some(prefixo => url.startsWith(prefixo));
    }

    Promise.all([
        carregarDoadores(),
        carregarTiposDoacao(),
        carregarCampanhas(),
        carregarDestinos()
    ]).then(() => {
        controlarCamposCategoria(true);
        carregarDoacoes();
    });
</script>

</body>
</html>
