<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solidário - Doadores</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sessao.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navigation :: appHeader}"></div>

<main class="conteudo">

    <div class="cabecalho-modulo">
        <div>
            <h2>Doadores cadastrados</h2>
            <p class="descricao">Cadastre, edite e gerencie pessoas que realizam doações.</p>
        </div>

        <button class="btn btn-verde" onclick="novoCadastro()">Novo Doador</button>
    </div>

    <div class="barra-lista">
        <input type="search" placeholder="Buscar doador..."
               oninput="filtrarTabela(this, 'tabelaDoadores')"
               aria-label="Buscar doadores">
    </div>

    <section class="card-form" id="formulario" style="display: none;">
        <h3 id="tituloFormulario">Novo Doador</h3>

        <input type="hidden" id="id">

        <div class="form-grid">
            <div>
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Nome do doador">
            </div>

            <div>
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div>
                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="Telefone">
            </div>

            <div>
                <label>E-mail</label>
                <input type="email" id="email" placeholder="email@exemplo.com">
            </div>

            <div class="campo-completo">
                <label>Endereço</label>
                <input type="text" id="endereco" placeholder="Endereço completo">
            </div>

            <div class="campo-completo">
                <label>Observação</label>
                <textarea id="observacao" placeholder="Observações"></textarea>
            </div>
        </div>

        <div class="acoes-form">
            <button class="btn btn-cinza" onclick="cancelar()">Cancelar</button>
            <button class="btn btn-verde" onclick="salvar()">Salvar</button>
        </div>
    </section>

    <section class="card-tabela">
        <table>
            <colgroup>
                <col class="col-id">
                <col>
                <col class="col-cpf">
                <col class="col-cpf">
                <col>
                <col class="col-acoes">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaDoadores">
            </tbody>
        </table>
    </section>

</main>

<script>
    function novoCadastro() {
        limparFormulario();
        document.getElementById("tituloFormulario").innerText = "Novo Doador";
        mostrarFormulario();
    }

    function cancelar() {
        limparFormulario();
        document.getElementById("formulario").style.display = "none";
    }

    function limparFormulario() {
        document.getElementById("id").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("observacao").value = "";
    }

    function carregarDoadores() {
        fetch("/doadores")
            .then(response => response.json())
            .then(doadores => {
                const tabela = document.getElementById("tabelaDoadores");
                tabela.innerHTML = "";

                if (doadores.length === 0) {
                    tabelaVazia(tabela, 6, "Nenhum doador cadastrado ainda.");
                    return;
                }

                doadores.forEach(doador => {
                    tabela.innerHTML += `
                        <tr>
                            <td>${doador.id}</td>
                            <td>${textoSeguro(doador.nome)}</td>
                            <td>${textoSeguro(formatarCpf(doador.cpf))}</td>
                            <td>${textoSeguro(formatarTelefone(doador.telefone))}</td>
                            <td>${textoSeguro(doador.email)}</td>
                            <td>
                                <button class="btn-tabela btn-azul" onclick="editar(${doador.id})">Editar</button>
                                <button class="btn-tabela btn-vermelho" onclick="excluir(${doador.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                mostrarErro("Erro ao carregar doadores: " + error.message);
            });
    }

    function salvar() {
        const id = document.getElementById("id").value;

        const doador = {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("cpf").value,
            telefone: document.getElementById("telefone").value,
            email: document.getElementById("email").value,
            endereco: document.getElementById("endereco").value,
            observacao: document.getElementById("observacao").value
        };

        const url = id ? `/doadores/${id}` : "/doadores";
        const metodo = id ? "PUT" : "POST";

        fetch(url, {
            method: metodo,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(doador)
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Erro ao salvar doador.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }
            })
            .then(() => {
                cancelar();
                carregarDoadores();
            })
            .catch(error => {
                mostrarErro("Erro ao salvar doador: " + error.message);
            });
    }

    function editar(id) {
        fetch(`/doadores/${id}`)
            .then(response => response.json())
            .then(doador => {
                document.getElementById("id").value = doador.id;
                document.getElementById("nome").value = doador.nome ?? "";
                document.getElementById("cpf").value = doador.cpf ?? "";
                document.getElementById("telefone").value = doador.telefone ?? "";
                document.getElementById("email").value = doador.email ?? "";
                document.getElementById("endereco").value = doador.endereco ?? "";
                document.getElementById("observacao").value = doador.observacao ?? "";

                document.getElementById("tituloFormulario").innerText = "Editar Doador";
                mostrarFormulario();
            })
            .catch(error => {
                mostrarErro("Erro ao buscar doador: " + error.message);
            });
    }

    function excluir(id) {
        if (!confirm("Deseja realmente excluir este doador?")) {
            return;
        }

        fetch(`/doadores/${id}`, {
            method: "DELETE"
        })
            .then(response => {
                if (!response.ok) {
                    return mensagemErro(response, "Não foi possível excluir o doador.")
                        .then(texto => {
                            throw new Error(texto);
                        });
                }

                carregarDoadores();
            })
            .catch(error => {
                mostrarErro("Erro ao excluir doador: " + error.message);
            });
    }

    carregarDoadores();
</script>

</body>
</html>
